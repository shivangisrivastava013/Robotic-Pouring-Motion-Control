[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robotic-pouring-motion-control"
version = "1.0.0"
description = "Reinforcement Learning & Classical Control for Precision Robotic Pouring in a Gymnasium Simulation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Shivangi Srivastava", email = "shivangisrivastava013@gmail.com"}
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.23.0",
    "gymnasium>=0.28.0",
    "stable-baselines3>=2.0.0",
    "matplotlib>=3.6.0",
    "pandas>=1.5.0",
    "seaborn>=0.12.0",
    "imageio>=2.30.0",
    "pillow>=9.5.0",
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.black]
line-length = 120
target-version = ['py310']

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
