name: Robotic Pouring CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install gymnasium stable-baselines3 numpy matplotlib pandas seaborn imageio pillow pyyaml ruff black pytest

      - name: Verify Python Compilation
        run: |
          python -c "import py_compile, glob; [py_compile.compile(f) for f in glob.glob('**/*.py', recursive=True)]"

      - name: Run Ruff Lint Check
        run: |
          python -m ruff check .

      - name: Run Black Code Format Check
        run: |
          python -m black --check .

      - name: Verify Gymnasium check_env Compliance
        run: |
          python -c "from stable_baselines3.common.env_checker import check_env; from pouring_sim.environment import RoboticPouringEnv; check_env(RoboticPouringEnv())"

      - name: Run Pytest Suite
        run: |
          python -m pytest tests/ -v

      - name: Run RL Smoke Benchmark Test
        run: |
          python scripts/compare_controllers.py --episodes 5 --mock-train

      - name: Build Docker Image
        run: |
          docker build -t robotic-pouring-motion-control:latest .
